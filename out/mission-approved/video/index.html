<!doctype html>
<!--
  mission-approved v2 — 15초 · 1920×1080 · 30fps · 450f
  기준: docs/video.md (캔버스 · 배경 · 글자 · 폰 · 부품), docs/motion.md (길이 · 곡선 · 머묾 · 카메라)
  장면표: out/mission-approved/scenes.md "A안 v2". 컷은 120BPM 박(15f) 위. 전환은 모두 컷 (motion.md 5장)
  효과음: assets/sfx (Openverse CC0 / CC BY, 출처 assets/sfx/CREDITS.md). 음악 없음
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>
    <script>
      gsap.registerPlugin(CustomEase);
      // docs/motion.md 1장 곡선
      CustomEase.create("ease-standard", "0.2, 0, 0.38, 0.9");
      CustomEase.create("ease-enter", "0, 0, 0.38, 0.9");
      CustomEase.create("ease-exit", "0.2, 0, 1, 0.9");
      CustomEase.create("ease-settle", "0.33, 1, 0.68, 1");
    </script>
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 400; src: url("assets/fonts/Pretendard-Regular.otf") format("opentype"); }
      @font-face { font-family: "Pretendard"; font-weight: 600; src: url("assets/fonts/Pretendard-SemiBold.otf") format("opentype"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.otf") format("opentype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #18191b; }
      #bg { position: absolute; inset: 0; background: #18191b; } /* video-bg = color-text */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <!-- 장면 (시작 f / 30) -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="2" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="5.5" data-duration="2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="7.5" data-duration="1.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="9" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="11.5" data-duration="1.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="13" data-duration="2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- 효과음: 화면 움직임 시작 프레임에 맞춤 -->
      <audio id="sfx-type-1" class="clip" src="assets/sfx/sfx_001.mp3" data-start="0" data-duration="0.9333" data-track-index="3" data-volume="0.35" data-fade-out="0.1"></audio>
      <audio id="sfx-rise" class="clip" src="assets/sfx/sfx_002.mp3" data-start="2" data-duration="1.3333" data-track-index="3" data-volume="0.4" data-fade-out="0.3"></audio>
      <audio id="sfx-push-1" class="clip" src="assets/sfx/sfx_003.mp3" data-start="3.8333" data-duration="0.4" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-card" class="clip" src="assets/sfx/sfx_004.mp3" data-start="5.5" data-duration="0.1" data-track-index="3" data-volume="0.5"></audio>
      <audio id="sfx-button" class="clip" src="assets/sfx/sfx_004.mp3" data-start="7.5" data-duration="0.1" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-click" class="clip" src="assets/sfx/sfx_005.mp3" data-start="8.5" data-duration="0.6" data-track-index="3" data-volume="0.5"></audio>
      <audio id="sfx-push-2" class="clip" src="assets/sfx/sfx_003.mp3" data-start="9.5" data-duration="0.4" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-chime" class="clip" src="assets/sfx/sfx_006.mp3" data-start="11.5" data-duration="1.5" data-track-index="3" data-volume="0.4" data-fade-out="0.4"></audio>
      <audio id="sfx-type-2" class="clip" src="assets/sfx/sfx_001.mp3" data-start="11.6333" data-duration="1.3333" data-track-index="4" data-volume="0.3" data-fade-out="0.1"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/sfx_007.mp3" data-start="13" data-duration="1.5" data-track-index="3" data-volume="0.5" data-fade-out="0.4"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
